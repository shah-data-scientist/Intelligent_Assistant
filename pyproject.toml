[project]
name = "intelligent-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Shahul SHAIK",email = "shah.data.scientist@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "langchain (>=1.2.4,<2.0.0)",
    "langchain-mistralai (>=1.1.1,<2.0.0)",
    "faiss-cpu (>=1.13.2,<2.0.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "streamlit (>=1.53.0,<2.0.0)",
    "plotly (>=6.5.2,<7.0.0)",
    "folium (>=0.20.0,<0.21.0)",
    "streamlit-folium (>=0.26.1,<0.27.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.14.11,<0.15.0)",
    "black (>=25.12.0,<26.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]
