[project]
name = "intelligent-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Shahul SHAIK",email = "shah.data.scientist@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn (>=0.32.0,<0.33.0)",
    "langchain (>=0.3.0,<0.4.0)",
    "langchain-core (>=0.3.0,<0.4.0)",
    "langchain-mistralai (>=0.2.0,<0.3.0)",
    "langchain-community (>=0.3.0,<0.4.0)",
    "faiss-cpu (>=1.9.0,<2.0.0)",
    "sqlalchemy (>=2.0.36,<3.0.0)",
    "streamlit (>=1.40.0,<2.0.0)",
    "plotly (>=5.24.1,<6.0.0)",
    "folium (>=0.18.0,<0.19.0)",
    "streamlit-folium (>=0.23.0,<0.24.0)",
    "beautifulsoup4 (>=4.12.3,<5.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "pybreaker (>=1.3.0,<2.0.0)",
    "sentence-transformers (>=3.2.0,<4.0.0)",
    "numpy (>=2.1.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.14.11,<0.15.0)",
    "black (>=25.12.0,<26.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]